<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
<style>
text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#17202a}.t{font-size:38px;font-weight:700}.s{font-size:21px}.b{font-size:24px;font-weight:700}.small{font-size:18px}.box{fill:#f7f9fb;stroke:#5d6d7e;stroke-width:2}.core{fill:#eaf2f8;stroke:#2874a6;stroke-width:3}.risk{fill:#fdebd0;stroke:#ca6f1e;stroke-width:3}.att{fill:#f5eef8;stroke:#7d3c98;stroke-width:3}.arr{stroke:#566573;stroke-width:4;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#566573"/></marker></defs>
<text x="60" y="70" class="t">2026 금융권 연쇄 침해 — 공격면 관점</text>
<text x="60" y="110" class="s">핵심계정보다 인터넷에 노출된 주변 업무지원 시스템이 반복적으로 공격 대상이 됨</text>
<rect x="60" y="190" rx="18" ry="18" width="300" height="210" class="att"/>
<text x="115" y="245" class="b">외부 공격자 / 자동화</text>
<text x="105" y="295" class="s">• 대량 자산 탐색</text><text x="105" y="330" class="s">• 파라미터 변형</text><text x="105" y="365" class="s">• IP 회전 / 재시도</text>
<rect x="500" y="150" rx="18" ry="18" width="360" height="300" class="risk"/>
<text x="575" y="205" class="b">인터넷 노출 주변 시스템</text>
<text x="545" y="255" class="s">대출모집인 조회 서비스</text><text x="545" y="292" class="s">RM / PB 모바일 업무지원</text><text x="545" y="329" class="s">ODS 영업지원 시스템</text><text x="545" y="366" class="s">외주 / 개발자용 웹페이지</text><text x="545" y="403" class="s">외부 솔루션 / 레거시 웹</text>
<rect x="1000" y="190" rx="18" ry="18" width="300" height="210" class="core"/>
<text x="1080" y="245" class="b">핵심 금융 시스템</text>
<text x="1065" y="295" class="s">Core Banking</text><text x="1065" y="330" class="s">Internet Banking</text><text x="1065" y="365" class="s">Mobile Banking</text>
<line x1="360" y1="295" x2="500" y2="295" class="arr"/>
<line x1="860" y1="295" x2="1000" y2="295" class="arr"/>
<text x="390" y="270" class="small">정찰·공격</text><text x="885" y="270" class="small">데이터 연계 가능성</text>
<rect x="500" y="520" rx="14" ry="14" width="800" height="160" class="box"/>
<text x="545" y="570" class="b">공통 약점으로 공개된 항목</text>
<text x="545" y="615" class="s">인증/인가 미흡 · 세션 검증 부족 · 단말기 접근통제 문제 · 알려진 웹 취약점 · 외부 솔루션 취약점</text>
<text x="545" y="650" class="small">※ 개별 금융사마다 실제 원인과 침투 경로는 다르며 일부는 조사 중</text>
<line x1="680" y1="450" x2="680" y2="520" class="arr"/>
</svg>