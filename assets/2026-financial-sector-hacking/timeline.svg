<g><circle cx="1060" cy="380" r="13" class="info"/><rect x="930" y="430" rx="12" width="300" height="185" class="card"/><text x="960" y="470" class="d">10/1~2</text><text x="960" y="510" class="s">BNK부산은행</text><text x="960" y="540" class="s">외부 웹서버 공격</text><text x="960" y="570" class="s">세션 검증 미흡 확인</text><line x1="1060" y1="395" x2="1060" y2="430" class="line"/></g>
