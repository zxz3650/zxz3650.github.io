<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
<style>
text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#17202a}.t{font-size:38px;font-weight:700}.d{font-size:25px;font-weight:700}.s{font-size:18px}.line{stroke:#5d6d7e;stroke-width:5}.dot{fill:#2874a6}.warn{fill:#ca6f1e}.info{fill:#7d3c98}.card{fill:#f8f9f9;stroke:#ccd1d1;stroke-width:2}
