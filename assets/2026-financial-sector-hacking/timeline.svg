<g><circle cx="460" cy="380" r="13" class="dot"/><rect x="345" y="430" rx="12" width="270" height="185" class="card"/><text x="375" y="470" class="d">9/28~30</text><text x="375" y="510" class="s">신한은행</text><text x="375" y="540" class="s">대출모집인 서비스</text><text x="375" y="570" class="s">본인확인 우회·반복 조회</text><line x1="460" y1="395" x2="460" y2="430" class="line"/></g>
